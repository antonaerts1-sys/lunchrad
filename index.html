  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'GTFlexa', sans-serif;
    background: #ffffff;
    color: #000;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 8px;
    overflow-x: hidden;
  }
  @media (max-height: 760px) {
    body { padding-top: 14px; }
    :root { --wheel: min(520px, 80vw, calc(100vh - 290px)); }
  }
  @media (max-width: 520px) {
    body { padding-top: 56px; }
    .gear-btn { width: 42px; height: 42px; top: 12px; right: 12px; }
    h1 { font-size: 40px; }
    .center-circle { width: 56px; height: 56px; font-size: 10px; }
  }

  .logo {
    height: 72px;
    width: auto;
    margin-bottom: 24px;
  }

  h1 {
    font-size: 64px;
    font-family: 'GTFlexa Condensed', 'GTFlexa', sans-serif; font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0;
    line-height: 0.9;
    margin-bottom: 8px;
    color: #000;
    text-align: center;
  }

  .subtitle {
    font-size: 16px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #000;
    margin-bottom: 40px;
    opacity: 0.5;
  }

  /* Rad schaalt mee: nooit breder dan het scherm, nooit hoger dan wat er onder de titel overblijft */
  :root { --wheel: min(520px, 80vw, calc(100vh - 310px)); }
  .wheel-stage { position: relative; padding: calc(var(--wheel) * 0.11); margin-top: 8px; }
  .ring {
    position: absolute; inset: 0; width: 100%; height: 100%;
    animation: ringSpin 40s linear infinite; pointer-events: none;
  }
  .ring text {
    font-family: 'GTFlexa Condensed', 'GTFlexa', sans-serif; text-transform: uppercase;
    font-size: 6px; letter-spacing: 0.37px; fill: #000;
  }
  @keyframes ringSpin { to { transform: rotate(360deg); } }
  /* ===== Hendel (gokkast) rechts van het rad ===== */
  .lever {
    position: absolute; top: 50%; right: -76px;
    width: 64px; height: calc(var(--wheel) * 0.62);
    transform: translateY(-60%); z-index: 12; touch-action: none; user-select: none;
  }
  .lever-base {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 40px; height: 40px; border-radius: 50%; background: #fff; border: 3px solid #000;
    box-shadow: inset 0 0 0 6px #000;
  }
  .lever-arm {
    position: absolute; bottom: 20px; left: 50%; width: 14px; height: calc(100% - 20px);
    background: #000; border-radius: 7px;
    transform-origin: 50% 100%;
    transform: translateX(-50%) rotate(var(--pull, 0deg));
    cursor: grab;
  }
  .lever.snapping .lever-arm { transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .lever.dragging .lever-arm { cursor: grabbing; }
  /* knop = TKK-hartje: zwarte rand (zelfde hart, iets groter, eronder) met oranjerode vulling */
  .lever-knob {
    /* de punt van het getekende hart zit op 65% van de breedte, onderaan; die zetten we op de top van de arm */
    position: absolute; top: -70px; left: 50%;
    transform-origin: 65% 100%;
    transform: translateX(-65%) rotate(12deg);
    width: 74px; height: 76px; color: #FC470F;

  .site-foot { margin-top: auto; padding: 20px 0 6px; display: flex; justify-content: center; }

    height: 100%;

  .pointer {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    transform-origin: center bottom;
    width: 0;
    height: 0;
    border-left: 20px solid transparent;
    border-right: 20px solid transparent;
    border-top: 40px solid #000;
    z-index: 10;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    transition: transform 0.08s ease-out;
  }

  .center-circle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 70px;
    height: 70px;
    background: #fff;
    border: 3px solid #000;
    border-radius: 50%;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'GTFlexa Condensed', 'GTFlexa', sans-serif; font-weight: 400;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #000;
  }

  .spin-btn {
    margin-top: 16px;
    background: transparent;
    color: #000;
    border: none;
    pointer-events: none;
    padding: 8px 16px;
    font-family: 'GTFlexa', sans-serif;
    font-size: 18px;
    font-family: 'GTFlexa Condensed', 'GTFlexa', sans-serif; font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 16px;
  }

  .spin-btn:active { transform: scale(0.97); }
  .spin-btn.disabled { opacity: 0.35; }

  .reset-btn {
    background: #000;
    color: #fff;
    border: none;
    padding: 12px 36px;
    font-family: 'GTFlexa', sans-serif;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 32px;
    display: none;
  }

  .reset-btn:hover { background: #333; }

  /* ===== Tandwiel + aanwezigheidspaneel ===== */
  .gear-btn {
    position: fixed; top: 20px; right: 20px; z-index: 40;
    width: 48px; height: 48px; border-radius: 50%;
    background: #fff; border: 1px solid #000; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.4s ease, background 0.2s;
  }
  .gear-btn:hover { transform: rotate(60deg); background: #ECEDEB; }
  .gear-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
  .gear-badge {
    position: absolute; top: -6px; right: -6px;
    min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px;
    background: #FC470F; color: #000; border: 1px solid #000;
    font-family: 'GTFlexa Condensed', 'GTFlexa', sans-serif; font-size: 14px;
    align-items: center; justify-content: center;
  }
  .settings-panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 340px; max-width: 100vw;
    background: #ECEDEB; border-left: 1px solid #000; z-index: 35;
    transform: translateX(100%); transition: transform 0.3s ease;
    display: flex; flex-direction: column;
  }
  .settings-panel.open { transform: translateX(0); }
  .settings-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 24px 24px 16px; border-bottom: 1px solid #000;
  }
  .settings-title {
    font-family: 'GTFlexa Condensed', 'GTFlexa', sans-serif; text-transform: uppercase;
    font-size: 28px; line-height: 0.9;
  }
  .settings-sub { font-size: 14px; margin-top: 6px; opacity: 0.7; }
  .settings-close {
    background: none; border: none; font-size: 32px; line-height: 1; cursor: pointer; color: #000;
    margin-right: 56px;
  }
  .settings-list { flex: 1; overflow-y: auto; padding: 8px 0; }
  .settings-item {
    display: flex; align-items: center; gap: 12px; padding: 8px 24px; cursor: pointer;
    font-size: 17px; transition: background 0.15s;
  }
  .settings-item:hover { background: rgba(0,0,0,0.05); }
  .settings-item input { width: 18px; height: 18px; accent-color: #00B800; cursor: pointer; }
  .settings-item.absent span { text-decoration: line-through; opacity: 0.45; }
  .settings-foot {
    padding: 16px 24px 24px; border-top: 1px solid #000;
    display: flex; flex-direction: column; gap: 10px; font-size: 13px; opacity: 0.9;
  }
  .settings-all {
    align-self: flex-start;
    background: transparent; border: 1px solid #000; border-radius: 9999px; padding: 10px 18px;
    font-family: 'GTFlexa Condensed', 'GTFlexa', sans-serif; text-transform: uppercase;
    font-size: 16px; cursor: pointer; transition: all 0.2s;
  }
  .settings-all:hover { background: #000; color: #fff; }

  /* Winnaar-tot-nu-toe: één rustige regel onder de hint, geen vlak */
  .winners-panel {
    display: none;
    margin-top: 6px;
    font-family: 'GTFlexa', sans-serif;
    font-size: 17px;
    color: #000;
    text-align: center;
    animation: slideIn 0.5s ease;
  }
  .winners-panel .winner-name {
    font-family: 'GTFlexa Condensed', 'GTFlexa', sans-serif; text-transform: uppercase;
    font-size: 24px; line-height: 1; margin-left: 6px; vertical-align: -1px;
    display: inline-block; transform-origin: center;
    animation: namePulse 1.6s ease-in-out infinite;
  }
  @keyframes namePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  @media (prefers-reduced-motion: reduce) { .winners-panel .winner-name { animation: none; } }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== FULLSCREEN WINNER OVERLAY ===== */
  .winner-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 60;
    pointer-events: none;
    opacity: 0;
  }

  .winner-overlay.active {
    animation: overlayFadeIn 0.4s ease forwards;
  }

  .winner-overlay.fade-out {
    animation: overlayFadeOut 0.5s ease forwards;
  }

  .winner-overlay .overlay-bg {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #fff; /* wit: zo komt de bloemen- en hartjesregen het best uit */
  }

  .winner-overlay .overlay-label {
    position: relative;
    font-size: 18px;
    font-family: 'GTFlexa Condensed', 'GTFlexa', sans-serif; font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 6px;
    color: #000;
    opacity: 0.4;
    margin-bottom: 16px;
    animation: revealUp 0.5s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .winner-overlay .overlay-name {
    position: relative;
    font-size: 100px;
    font-family: 'GTFlexa Condensed', 'GTFlexa', sans-serif; font-weight: 400;
    text-transform: uppercase;
    letter-spacing: -2px;
    color: #000;
    line-height: 1;
    animation: nameBounceIn 0.7s 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .winner-overlay .overlay-sub {
    position: relative;
    font-size: 18px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #000;
    opacity: 0.35;
    margin-top: 20px;
    animation: revealUp 0.4s 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes overlayFadeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  @keyframes overlayFadeOut {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }

  @keyframes nameBounceIn {
    0% { opacity: 0; transform: scale(0.3) translateY(40px); }
    60% { opacity: 1; transform: scale(1.08) translateY(-5px); }
    80% { transform: scale(0.96) translateY(2px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  @keyframes revealUp {
    0% { opacity: 0; transform: translateY(20px); }
    100% { opacity: 0.4; transform: translateY(0); }
  }

  /* ===== FINALE OVERLAY ===== */
  /* ===== SLOTSCHERM: vol TKK-kleurvlak ===== */
  .finale-overlay {
    position: fixed; inset: 0;
    background: #3391FF;
    color: #000;
    z-index: 50;
    opacity: 0; pointer-events: none; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    clip-path: circle(0% at 50% 50%);
  }
  .finale-overlay.active {
    opacity: 1; pointer-events: auto;
    animation: finaleWipe 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes finaleWipe {
    0% { clip-path: circle(0% at 50% 50%); }
    100% { clip-path: circle(150% at 50% 50%); }
  }
  .finale-logo {
    position: absolute; top: 32px; left: 50%; transform: translateX(-50%);
    height: 64px; width: auto;
    animation: finaleDrop 0.7s 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes finaleDrop {
    0% { opacity: 0; transform: translateX(-50%) translateY(-80px) rotate(-6deg); }
    100% { opacity: 1; transform: translateX(-50%) translateY(0) rotate(0); }
  }
  .finale-kicker {
    font-family: 'GTFlexa', sans-serif; font-size: 18px; margin-bottom: 18px;
    animation: finaleUp 0.6s 0.9s ease both;
  }
  .finale-names {
    display: flex; flex-direction: column; align-items: center; gap: 0;
    text-align: center;
  }
  .finale-name {
    font-family: 'GTFlexa Condensed', 'GTFlexa', sans-serif; text-transform: uppercase;
    font-size: clamp(64px, 14vw, 180px); line-height: 0.85; letter-spacing: -0.01em;
    overflow: hidden; padding: 0 0.05em;
  }
  .finale-name span {
    display: block;
    animation: finaleRise 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .finale-name:nth-child(1) span { animation-delay: 1.0s; }
  .finale-name:nth-child(3) span { animation-delay: 1.35s; }
  @keyframes finaleRise {
    0% { transform: translateY(110%) rotate(3deg); }
    100% { transform: translateY(0) rotate(0); }
  }
  .finale-amp {
    width: 84px; height: 84px; border-radius: 50%;
    background: #FC470F; border: 2px solid #000;
    display: flex; align-items: center; justify-content: center;
    font-family: 'GTFlexa Condensed', 'GTFlexa', sans-serif; font-size: 52px; line-height: 1;
    margin: 10px 0; transform: rotate(-8deg);
    animation: finalePop 0.5s 1.25s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes finalePop {
    0% { opacity: 0; transform: scale(0) rotate(-60deg); }
    100% { opacity: 1; transform: scale(1) rotate(-8deg); }
  }
  .finale-foot {
    display: flex; align-items: center; gap: 18px; margin-top: 40px;
    font-family: 'GTFlexa Condensed', 'GTFlexa', sans-serif; text-transform: uppercase; font-size: 26px;
    animation: finaleUp 0.6s 1.9s ease both;
  }
  .finale-foot svg { width: 44px; height: auto; }
  .finale-btn {
    background: transparent; border: 1px solid #000; border-radius: 9999px; padding: 14px 26px;
    font-family: 'GTFlexa Condensed', 'GTFlexa', sans-serif; text-transform: uppercase; font-size: 22px;
    color: #000; cursor: pointer; display: inline-flex; align-items: center; gap: 12px;
    transition: all 0.2s ease-in-out;
  }
  .finale-btn svg { width: 29px; height: 14px; transition: transform 0.2s ease-in-out; }
  .finale-btn:hover { background: #000; color: #fff; }
  .finale-btn:hover svg path { fill: #fff; }
  .finale-btn:hover svg { transform: translateX(25%); }
  @keyframes finaleUp {
    0% { opacity: 0; transform: translateY(24px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @media (max-width: 700px) {
    .finale-foot { flex-direction: column; gap: 12px; font-size: 20px; }
  }

  /* ===== Kermisboodschappen in de witte marge ===== */
  .flash-layer { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .flash {
    position: absolute; max-width: 22vw;
    font-family: 'GTFlexa Condensed', 'GTFlexa', sans-serif; text-transform: uppercase;
    font-size: clamp(28px, 3.4vw, 56px); line-height: 0.9; color: #000; text-align: center;
    text-wrap: balance;
    animation: flashIn 1.9s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .flash.hi { color: var(--hi); }
  @keyframes flashIn {
    0% { opacity: 0; transform: rotate(var(--rot)) scale(0.6); }
    12% { opacity: 1; transform: rotate(var(--rot)) scale(1.08); }
    18% { transform: rotate(var(--rot)) scale(1); }
    80% { opacity: 1; transform: rotate(var(--rot)) scale(1); }
    100% { opacity: 0; transform: rotate(var(--rot)) scale(0.95); }
  }
  @media (prefers-reduced-motion: reduce) { .flash { animation-duration: 2.6s; } }

  /* ===== Pijlen die naar de hendel schieten (na winnaar 1) ===== */
  .arrow-layer { position: fixed; inset: 0; pointer-events: none; z-index: 6; overflow: hidden; }
  .arrow-layer svg {
    position: absolute; left: 0; top: 0; width: 110px; height: auto;
    transform-origin: 0 50%;
    animation: arrowShoot 1.4s cubic-bezier(0.2, 0.7, 0.3, 1) both;
  }
  @keyframes arrowShoot {
    0%   { opacity: 0; transform: translate(var(--x0), var(--y0)) rotate(var(--a)) scale(0.7); }
    15%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--x1), var(--y1)) rotate(var(--a)) scale(1); }
  }

  /* ===== Muisspoor ===== */
  .trail-canvas {
    position: fixed; inset: 0; pointer-events: none; z-index: 300;
  }

  .confetti-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 100;
  }
</style>
</head>

<script>
const allNames = [
  "Jan H.", "Leen", "Kristof", "Bram", "Tim",
  "Annelies", "Eva V.", "Kim", "Stephanie", "Eva B.",
  "Karel-Jan", "Hannah", "Anton L.", "Eline", "Laure",
  "Sarah O.", "Jill", "Merel", "Seppe", "Emily",
  "Ben", "Joanna", "Ashley", "Sarah M.", "Maarten",
  "Charlot", "Emma", "Nils", "David", "Pieter Jelle",
  "Sten", "Anton A.", "Robin", "Lore", "Rein",
  "Michael", "Jan B.", "Jonas", "Cedric", "Lori",
  "Peter", "Lennert", "Ine", "Rebecca", "Zias"
];

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const cx = W / 2;
const cy = H / 2;
const radius = W / 2 - 20;
const brandColors = ['#00B800', '#FC470F', '#3391FF', '#E80094'];

// ===== AFWEZIGEN (tandwiel): bewaard in de browser =====
const ABSENT_KEY = 'lunchrad-afwezig';
let absent = new Set();
try { absent = new Set(JSON.parse(localStorage.getItem(ABSENT_KEY) || '[]')); } catch (e) {}
absent = new Set([...absent].filter(n => allNames.includes(n)));

let names = [], segAngle = 0, palette = [];
function buildWheel() {
  names = allNames.filter(n => !absent.has(n));
  segAngle = (2 * Math.PI) / names.length;
  palette = names.map((_, i) => brandColors[i % 4]);
  // laatste vak mag niet dezelfde kleur hebben als het eerste (ze raken elkaar)
  if (palette.length > 2 && palette[palette.length - 1] === palette[0]) {
    palette[palette.length - 1] = brandColors.find(c => c !== palette[0] && c !== palette[palette.length - 2]);
  }
  const badge = document.getElementById('absentCount');
  badge.textContent = absent.size;
  badge.style.display = absent.size ? 'flex' : 'none';
  document.getElementById('settingsSub').textContent =
    absent.size ? `${names.length} op het rad, ${absent.size} afwezig` : `Iedereen aanwezig (${names.length})`;
}
buildWheel();

function renderSettings() {
  const list = document.getElementById('settingsList');
  list.innerHTML = '';
  allNames.forEach(n => {
    const lbl = document.createElement('label');
    lbl.className = 'settings-item' + (absent.has(n) ? ' absent' : '');
    lbl.innerHTML = `<input type="checkbox" ${absent.has(n) ? '' : 'checked'}><span>${n}</span>`;
    lbl.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) absent.delete(n); else absent.add(n);
      lbl.classList.toggle('absent', !e.target.checked);
      localStorage.setItem(ABSENT_KEY, JSON.stringify([...absent]));
      buildWheel();
      resetWheel();
    });
    list.appendChild(lbl);
  });
}

function toggleSettings(open) {
  if (spinning) return;
  const panel = document.getElementById('settingsPanel');
  const show = open !== undefined ? open : !panel.classList.contains('open');
  if (show) renderSettings();
  panel.classList.toggle('open', show);
}

function everyonePresent() {
  absent.clear();
  localStorage.removeItem(ABSENT_KEY);
  renderSettings();
  buildWheel();
  resetWheel();
}

let currentAngle = 0;
let spinning = false;
let winners = [];
let eliminatedIndex = -1;
let flashIndex = -1;
let flashPhase = 0;

function setHintDisabled(v) {
  const el = document.getElementById('spinBtn');
  el.disabled = v;                 // property, gelezen door canPull() van de hendel
  el.classList.toggle('disabled', v);
}

// ===== HENDEL: trekken = draaien =====
(function leverControl() {
  const lever = document.getElementById('lever');
  const arm = document.getElementById('leverArm');
  const MAX = 140, TRIGGER = 95; // graden
  let dragging = false, angle = 0, pivot = null;

  function canPull() {
    const btn = document.getElementById('spinBtn');
    return !spinning && !btn.disabled && btn.style.display !== 'none';
  }
  function setAngle(a) {
    angle = Math.max(0, Math.min(MAX, a));
    arm.style.setProperty('--pull', angle + 'deg');
  }
  function angleFor(x, y) {
    const dx = x - pivot.x, dy = y - pivot.y;
    return Math.atan2(dx, -dy) * 180 / Math.PI; // 0 = recht omhoog, 90 = opzij, 180 = omlaag
  }
  function release() {
    lever.classList.remove('dragging');
    lever.classList.add('snapping');
    const fire = angle >= TRIGGER && canPull();
    if (fire) { initAudio(); playLeverClack(); }
    setAngle(0);
    setTimeout(() => lever.classList.remove('snapping'), 500);
    if (fire) setTimeout(spin, 120);
  }
  function syncState() { lever.classList.toggle('disabled', !canPull()); requestAnimationFrame(syncState); }
  syncState();

  arm.addEventListener('pointerdown', e => {
    if (!canPull()) return;
    e.preventDefault();
    arm.setPointerCapture(e.pointerId);
    const r = arm.getBoundingClientRect();
    pivot = { x: r.left + r.width / 2, y: r.bottom };
    dragging = true;
    lever.classList.add('dragging');
    lever.classList.remove('snapping');
    initAudio();
  });
  arm.addEventListener('pointermove', e => {
    if (!dragging) return;
    const prev = angle;
    setAngle(angleFor(e.clientX, e.clientY));
    if (Math.floor(prev / 12) !== Math.floor(angle / 12)) playTick(0.08); // ratel tijdens het trekken
  });
  arm.addEventListener('pointerup', e => {
    if (!dragging) return;
    dragging = false;
    if (angle < 15) {
      // gewoon klikken: de hendel trekt zichzelf
      lever.classList.add('snapping');
      setAngle(MAX);
      setTimeout(() => { angle = MAX; release(); }, 420);
    } else release();
  });
  arm.addEventListener('pointercancel', () => { if (dragging) { dragging = false; release(); } });
})();

function playLeverClack() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  // zware metalen "klak" van de hendel die terugslaat
  const osc = audioCtx.createOscillator();
  osc.type = 'square';
  osc.frequency.setValueAtTime(180, t);
  osc.frequency.exponentialRampToValueAtTime(50, t + 0.12);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.25, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 900;
  osc.connect(lp).connect(g).connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.2);
  playTick(0.5);
}

// ===== AUDIO: tick sound via Web Audio API =====
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playTick(volume = 0.15) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;

  // Soft wooden "tok" — filtered noise burst
  const bufferSize = audioCtx.sampleRate * 0.03; // 30ms
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    // Noise that decays fast
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 8);
  }

  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  // Bandpass filter to get a woody tone
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(400 + Math.random() * 200, t); // slight variation
  filter.Q.setValueAtTime(2, t);

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(volume * 0.6, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.035);

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start(t);
  noise.stop(t + 0.04);
}

// ===== POINTER BOUNCE =====
const pointer = document.getElementById('pointer');
let pointerTimeout = null;
function bouncePointer() {
  pointer.style.transform = 'translateX(-50%) rotate(12deg)';
  clearTimeout(pointerTimeout);
  pointerTimeout = setTimeout(() => {
    pointer.style.transform = 'translateX(-50%) rotate(0deg)';
  }, 80);
}

// ===== DRAWING =====
function drawWheel() {
  ctx.clearRect(0, 0, W, H);

  for (let i = 0; i < names.length; i++) {
    const startAngle = currentAngle + i * segAngle;
    const endAngle = startAngle + segAngle;
    const isEliminated = i === eliminatedIndex;
    const isFlashing = i === flashIndex;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, startAngle, endAngle);
    ctx.closePath();

    if (isEliminated) {
      ctx.fillStyle = '#e0e0e0';
    } else if (isFlashing) {
      // Flash between white and original color
      ctx.fillStyle = flashPhase % 2 === 0 ? '#fff' : palette[i];
    } else {
      ctx.fillStyle = palette[i];
    }
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, startAngle, endAngle);
    ctx.closePath();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Name text
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startAngle + segAngle / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = isEliminated ? '#bbb' : '#000';
    ctx.font = `400 ${isEliminated ? 17 : 21}px 'GTFlexa Condensed', 'GTFlexa', sans-serif`;
    ctx.fillText(names[i].toUpperCase(), radius - 26, 6);
    ctx.restore();
  }

  // Outer ring
  ctx.beginPath();
  ctx.arc(cx, cy, radius + 4, 0, 2 * Math.PI);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 6;
  ctx.stroke();
}

function getSelectedIndex() {
  const pointerAngle = -Math.PI / 2;
  let normalizedAngle = (pointerAngle - currentAngle) % (2 * Math.PI);
  if (normalizedAngle < 0) normalizedAngle += 2 * Math.PI;
  return Math.floor(normalizedAngle / segAngle);
}

// ===== FLASH winning segment =====
function flashWinner(idx, callback) {
  flashIndex = idx;
  let count = 0;
  const totalFlashes = 8;

  function doFlash() {
    flashPhase = count;
    drawWheel();
    count++;
    if (count <= totalFlashes) {
      setTimeout(doFlash, 120 + count * 20); // slows down
    } else {
      flashIndex = -1;
      drawWheel();
      setTimeout(callback, 200);
    }
  }
  doFlash();
}

// ===== SPIN with dramatic easing, ticks, pointer bounce =====
function spin() {
  if (spinning) return;
  initAudio();
  toggleSettings(false);
  window.hasSpunOnce = true;
  document.getElementById('flashLayer').innerHTML = '';
  spinning = true;
  document.getElementById('gearBtn').disabled = true;
  setHintDisabled(true);
  document.getElementById('centerLabel').textContent = '...';

  // More rotations for more drama (7-11 full rotations)
  const baseRotations = (7 + Math.random() * 4) * 2 * Math.PI;
  let targetAngle = currentAngle + baseRotations;

  // For 2nd spin: ensure we land on a valid (non-eliminated) segment
  if (eliminatedIndex >= 0) {
    // Pick a random valid index (exclude eliminated)
    const validIndices = names.map((_, i) => i).filter(i => i !== eliminatedIndex);
    const chosenIdx = validIndices[Math.floor(Math.random() * validIndices.length)];
    // Calculate exact angle to land pointer on the middle of chosen segment
    const pointerAngle = -Math.PI / 2;
    const segCenter = chosenIdx * segAngle + segAngle / 2;
    // We need (pointerAngle - targetAngle) mod 2PI = segCenter
    const fullRotations = Math.floor(baseRotations / (2 * Math.PI)) * 2 * Math.PI;
    targetAngle = currentAngle + fullRotations + (pointerAngle - segCenter - currentAngle % (2 * Math.PI) + 4 * Math.PI) % (2 * Math.PI);
    // Ensure enough total rotation
    if (targetAngle - currentAngle < 7 * 2 * Math.PI) targetAngle += 2 * Math.PI;
  }
  const startAngle = currentAngle;
  // Longer duration for more suspense
  const duration = 6000 + Math.random() * 2000;
  const startTime = performance.now();
  let lastSegIndex = getSelectedIndex();

  // Dramatic easing: very slow at end with slight overshoot
  function easeOutExpo(t) {
    if (t >= 1) return 1;
    return 1 - Math.pow(2, -12 * t);
  }

  // Overshoot function: goes slightly past then bounces back
  function easeWithBounce(t) {
    const base = easeOutExpo(t);
    if (t > 0.92) {
      // Bounce zone: overshoot then settle
      const bounceT = (t - 0.92) / 0.08; // 0 to 1 in bounce zone
      const bounce = Math.sin(bounceT * Math.PI * 2.5) * 0.003 * (1 - bounceT);
      return base + bounce;
    }
    return base;
  }

  function animate(time) {
    const elapsed = time - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = easeWithBounce(progress);

    currentAngle = startAngle + (targetAngle - startAngle) * eased;
    drawWheel();

    // Tick detection: did we cross a segment boundary?
    const currentSegIndex = getSelectedIndex();
    if (currentSegIndex !== lastSegIndex) {
      // Volume based on speed (louder when slower = more dramatic)
      const speed = 1 - progress;
      const vol = progress > 0.7 ? 0.25 : 0.1 + speed * 0.1;
      playTick(vol);
      bouncePointer();
      lastSegIndex = currentSegIndex;
    }

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      // Spin complete — flash then reveal
      spinning = false;
      const selectedIdx = getSelectedIndex();

      if (winners.length === 0) {
        // Flash the winning segment first
        flashWinner(selectedIdx, () => {
          winners.push(names[selectedIdx]);
          eliminatedIndex = selectedIdx;
          drawWheel();

          document.getElementById('centerLabel').textContent = '1/2';
          showWinnerOverlay(names[selectedIdx], () => {
            showWinner(1, names[selectedIdx]);
            setHintDisabled(false);
            document.getElementById('spinBtn').textContent = 'Trek nog eens voor winnaar 2';
          }, null, 'Winnaar 1', 'Nog 1 te gaan');
        });
      } else if (winners.length === 1) {
        const idx = selectedIdx;

        flashWinner(idx, () => {
          winners.push(names[idx]);

          document.getElementById('centerLabel').textContent = '2/2';
          showWinnerOverlay(names[idx], () => {
            showWinner(2, names[idx]);
            setTimeout(() => {
              showFinale(winners[0], winners[1]);
            }, 400);
          }, 'orange', 'Winnaar 2', '');
        });
      }
    }
  }

  requestAnimationFrame(animate);
}

// ===== AUDIO: hemels geluid bij een winnaar =====
// Zachte galm: convolver met een synthetische, uitstervende ruis-impuls
let reverb = null;
function getReverb() {
  if (reverb) return reverb;
  const len = audioCtx.sampleRate * 3;
  const buf = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.5);
  }
  const conv = audioCtx.createConvolver();
  conv.buffer = buf;
  const wet = audioCtx.createGain();
  wet.gain.value = 0.6;
  conv.connect(wet).connect(audioCtx.destination);
  reverb = conv;
  return conv;
}

// Eén zachte stem: sinus + een beetje driehoek, trage aanslag, lange uitklank, door de galm
function playVoice(freq, t, attack, hold, release, vol = 0.12) {
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + attack);
  g.gain.setValueAtTime(vol, t + attack + hold);
  g.gain.exponentialRampToValueAtTime(0.0005, t + attack + hold + release);
  // warm filter, haalt alle scherpte weg
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(1800, t);
  g.connect(lp);
  lp.connect(audioCtx.destination);
  lp.connect(getReverb());
  [['sine', 1, 1], ['triangle', 1, 0.25], ['sine', 2, 0.12]].forEach(([type, ratio, amp]) => {
    const osc = audioCtx.createOscillator();
    osc.type = type;
    osc.frequency.setValueAtTime(freq * ratio, t);
    // heel lichte zweving (chorus)
    osc.detune.setValueAtTime((Math.random() - 0.5) * 8, t);
    const og = audioCtx.createGain();
    og.gain.value = amp;
    osc.connect(og).connect(g);
    osc.start(t);
    osc.stop(t + attack + hold + release + 0.1);
  });
}

function playJackpot(big = false) {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime + 0.05;
  // Akkoord dat opengaat als een wolk: C-majeur, stem voor stem (C4 E4 G4 C5 E5)
  const chord = [261.63, 329.63, 392.0, 523.25, 659.25];
  chord.forEach((f, i) => playVoice(f, t0 + i * 0.18, 0.5, 1.2, 2.2, 0.11));
  // Zachte stijgende "aaah": hoge stemmen die er traag bijkomen
  [783.99, 1046.5].forEach((f, i) => playVoice(f, t0 + 0.9 + i * 0.3, 0.8, 0.8, 2.5, 0.05));
  if (big) {
    // Finale: nog een octaaf erboven, heel zacht, plus een diepe grondtoon eronder
    playVoice(130.81, t0, 0.8, 2.0, 2.5, 0.09);
    [1318.5, 1568].forEach((f, i) => playVoice(f, t0 + 1.6 + i * 0.3, 1.0, 0.6, 2.8, 0.03));
  }
}

function showWinnerOverlay(name, onDone, colorClass, labelText, subText) {
  const overlay = document.getElementById('winnerOverlay');
  const overlayName = document.getElementById('overlayName');
  const overlayLabel = document.querySelector('.winner-overlay .overlay-label');
  const overlaySub = document.querySelector('.winner-overlay .overlay-sub');

  overlayName.textContent = name.toUpperCase();
  overlayLabel.textContent = labelText || 'Winnaar 1';
  overlaySub.textContent = subText !== undefined ? subText : 'Nog 1 te gaan';
  overlaySub.style.display = subText === '' ? 'none' : 'block';

  // Force re-trigger animations by cloning inner elements
  overlayLabel.style.animation = 'none';
  overlayName.style.animation = 'none';
  overlaySub.style.animation = 'none';
  void overlayLabel.offsetHeight; // reflow
  overlayLabel.style.animation = '';
  overlayName.style.animation = '';
  overlaySub.style.animation = '';

  overlay.classList.remove('orange', 'fade-out');
  if (colorClass) overlay.classList.add(colorClass);
  overlay.style.opacity = '';
  overlay.classList.add('active');
  playJackpot(subText === '');
  launchKribbelRain(subText === '' ? 'hart' : 'bloem-dikke-lijn');

  setTimeout(() => {
    overlay.classList.remove('active');
    overlay.classList.add('fade-out');

    setTimeout(() => {
      overlay.classList.remove('fade-out', 'orange');
      overlay.style.opacity = '0';
      if (onDone) onDone();
    }, 500);
  }, 2800);
}

// ===== AUDIO: koor dat "aaah" zingt =====
// Een klinker ontstaat door formanten: pieken in het spectrum. "Aah" zit rond 750 / 1150 / 2600 Hz.
function playChoirVoice(freq, t, dur, vol) {
  const out = audioCtx.createGain();
  out.gain.setValueAtTime(0, t);
  out.gain.linearRampToValueAtTime(vol, t + dur * 0.45);      // traag aanzwellen
  out.gain.setValueAtTime(vol, t + dur * 0.8);
  out.gain.linearRampToValueAtTime(0, t + dur);
  out.connect(audioCtx.destination);
  out.connect(getReverb());
  const formants = [[750, 1.0, 8], [1150, 0.45, 10], [2600, 0.12, 12]];
  formants.forEach(([fc, amp, q]) => {
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(fc, t);
    bp.Q.setValueAtTime(q, t);
    const fg = audioCtx.createGain();
    fg.gain.value = amp;
    bp.connect(fg).connect(out);
    // drie zangers per toon, licht uit elkaar, elk met eigen vibrato
    [-7, 0, 7].forEach(cents => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, t);
      osc.detune.setValueAtTime(cents, t);
      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      lfo.frequency.setValueAtTime(4.5 + Math.random(), t);
      lfoGain.gain.setValueAtTime(0, t);
      lfoGain.gain.linearRampToValueAtTime(9, t + dur * 0.5);
      lfo.connect(lfoGain).connect(osc.detune);
      osc.connect(bp);
      osc.start(t); osc.stop(t + dur + 0.05);
      lfo.start(t); lfo.stop(t + dur + 0.05);
    });
  });
}

function playChoir(t, dur = 2.4) {
  // Vierstemmig C-majeur, bas tot sopraan, de hoge stemmen komen iets later binnen
  [[130.81, 0.0, 0.05], [196.0, 0.1, 0.045], [261.63, 0.2, 0.045], [329.63, 0.35, 0.035], [392.0, 0.5, 0.03]]
    .forEach(([f, delay, vol]) => playChoirVoice(f, t + delay, dur - delay, vol));
}

// ===== AUDIO: trompetfanfare bij de finale =====
function playBrass(freq, t, dur, vol = 0.14) {
  // Koperblazer: twee licht ontstemde zaagtanden door een lowpass die meeopent met de aanslag
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.Q.setValueAtTime(1.2, t);
  filter.frequency.setValueAtTime(freq * 1.5, t);
  filter.frequency.linearRampToValueAtTime(freq * 4, t + 0.06);
  filter.frequency.exponentialRampToValueAtTime(freq * 2.5, t + dur);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.04);
  g.gain.setValueAtTime(vol, t + dur - 0.06);
  g.gain.linearRampToValueAtTime(0, t + dur);
  filter.connect(g).connect(audioCtx.destination);
  g.connect(getReverb());
  [-4, 4].forEach(cents => {
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, t);
    osc.detune.setValueAtTime(cents, t);
    // kleine vibrato op lange noten
    if (dur > 0.4) {
      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      lfo.frequency.setValueAtTime(5.5, t);
      lfoGain.gain.setValueAtTime(0, t);
      lfoGain.gain.linearRampToValueAtTime(6, t + 0.3);
      lfo.connect(lfoGain).connect(osc.detune);
      lfo.start(t); lfo.stop(t + dur);
    }
    osc.connect(filter);
    osc.start(t); osc.stop(t + dur + 0.02);
  });
}

function playFanfare(startAt) {
  if (!audioCtx) return;
  let t = startAt || (audioCtx.currentTime + 0.1);
  // Ta-ta-ta-TAA, ta-ta-TAAAA (C C C E, C E G)
  const melody = [[523.25, 0.13], [523.25, 0.13], [523.25, 0.13], [659.25, 0.42], [523.25, 0.13], [659.25, 0.13], [783.99, 1.1]];
  melody.forEach(([f, d], i) => {
    playBrass(f, t, d);
    t += d + (i === 3 ? 0.08 : 0.02);
  });
  // Slotakkoord onder de lange noot: C-E-G een octaaf lager
  const chordStart = t - 1.12;
  [261.63, 329.63, 392.0].forEach(f => playBrass(f, chordStart, 1.1, 0.09));
}

function showFinale(name1, name2) {
  if (audioCtx) {
    const t = audioCtx.currentTime + 0.1;
    playChoir(t, 2.4);          // aaaaaah...
    playFanfare(t + 2.1);       // ...en dan de trompet, net voor het koor wegsterft
  }
  const finale = document.getElementById('finaleOverlay');
  finale.classList.remove('active');
  // animaties opnieuw laten starten
  finale.querySelectorAll('.finale-logo, .finale-name span, .finale-amp, .finale-foot').forEach(el => {
    el.style.animation = 'none';
    void el.offsetHeight;
    el.style.animation = '';
  });
  document.getElementById('finaleName1').textContent = name1.toUpperCase();
  document.getElementById('finaleName2').textContent = name2.toUpperCase();
  finale.classList.add('active');
  launchConfetti(14000);

  document.getElementById('spinBtn').style.display = 'none';
  document.getElementById('resetBtn').style.display = 'block';
}

function showWinner(num, name) {
  const panel = document.getElementById('winnersPanel');
  const list = document.getElementById('winnersList');
  panel.style.display = 'block';
  if (num === 1) {
    list.innerHTML = `Alvast één winnaar: <span class="winner-name">${name.toUpperCase()}</span>`;
  } else {
    list.innerHTML = `Winnaars: <span class="winner-name">${winners[0].toUpperCase()}</span> &amp; <span class="winner-name">${name.toUpperCase()}</span>`;
  }
}

function resetWheel() {
  confettiRun++;
  document.getElementById('gearBtn').disabled = false;
  winners = [];
  eliminatedIndex = -1;
  currentAngle = 0;

  document.getElementById('winnersList').innerHTML = '';
  document.getElementById('winnersPanel').style.display = 'none';
  document.getElementById('finaleOverlay').classList.remove('active');
  document.getElementById('spinBtn').style.display = 'block';
  setHintDisabled(false);
  document.getElementById('spinBtn').textContent = 'Trek aan de hendel';
  document.getElementById('resetBtn').style.display = 'none';
  document.getElementById('centerLabel').textContent = 'Spin';
  pointer.style.transform = 'translateX(-50%) rotate(0deg)';

  drawWheel();
}

function kribbelImage(name, color) {
  const img = new Image();

}

// ===== CONFETTI: vallende Kind Kids-logo's =====
// Het inline logo wordt per kleur omgezet naar een afbeelding (wit, zwart, groen, oranjerood, roze; blauw valt weg op het blauwe slotscherm)
const confettiLogos = [];
const logoSvgRaw = (() => {
  const svgEl = document.querySelector('svg.logo');
  return svgEl ? svgEl.outerHTML.replace(/ class="logo"[^>]*?(?=width)/, ' ') : '';
})();
function logoImage(color) {
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(logoSvgRaw.replace(/fill="black"/g, `fill="${color}"`));
  return img;
}
const confettiColors = ['#FFFFFF', '#000000', '#00B800', '#FC470F', '#E80094'];
confettiColors.forEach(c => confettiLogos.push(logoImage(c)));
const confettiKribbels = [];
KRIBBEL_NAMES.forEach(n => confettiColors.forEach(c => confettiKribbels.push(kribbelImage(n, c))));

// Regen van één kribbel (bv. enkel bloemen of enkel hartjes) bij een winnaar
const kribbelRainImages = {};
function launchKribbelRain(name, duration = 3200) {
  if (!kribbelRainImages[name]) {
    kribbelRainImages[name] = ['#000000', '#00B800', '#FC470F', '#3391FF', '#E80094'].map(c => kribbelImage(name, c));
  }
  launchConfetti(duration, kribbelRainImages[name], 90);
}
function launchConfetti(duration = 14000, onlyImages = null, count = 160) {
  const run = ++confettiRun;
  const cCanvas = document.getElementById('confetti');
  cCanvas.width = window.innerWidth;
  cCanvas.height = window.innerHeight;
  const cCtx = cCanvas.getContext('2d');
  const pieces = [];
  const startTime = performance.now();

  function newPiece(fromTop) {
    const isLogo = !onlyImages && Math.random() < 0.45;
    const pool = onlyImages || (isLogo ? confettiLogos : confettiKribbels);
    const img = pool[Math.floor(Math.random() * pool.length)];
    const w = isLogo ? 40 + Math.random() * 44 : 26 + Math.random() * 30;
    return {
      x: Math.random() * cCanvas.width,
      y: fromTop ? -60 - Math.random() * 200 : Math.random() * -cCanvas.height,
      w, isLogo,
      img,
      speed: 1.8 + Math.random() * 3.4,
      angle: (Math.random() - 0.5) * 0.8,
      spin: (Math.random() - 0.5) * 0.06,
      drift: (Math.random() - 0.5) * 1.6,
      flutter: Math.random() * Math.PI * 2,
      flutterSpeed: 0.05 + Math.random() * 0.08,
      opacity: 1
    };
  }
  for (let i = 0; i < count; i++) pieces.push(newPiece(false));

  function animateConfetti() {
    if (run !== confettiRun) { cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height); return; }
    cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
    const elapsed = performance.now() - startTime;
    const raining = elapsed < duration;

    let alive = false;
    pieces.forEach(p => {
      p.y += p.speed;
      p.flutter += p.flutterSpeed;
      p.x += p.drift + Math.sin(p.flutter) * 1.2;
      p.angle += p.spin;
      if (p.y > cCanvas.height + 40) {
        if (raining) Object.assign(p, newPiece(true)); // blijft regenen zolang het slotscherm vers is
        else p.opacity = 0;
      }
      if (!raining) p.opacity -= 0.004;

      if (p.opacity > 0) {
        alive = true;
        cCtx.save();
        cCtx.translate(p.x, p.y);
        cCtx.rotate(p.angle);
        cCtx.scale(1, Math.max(0.15, Math.abs(Math.cos(p.flutter))));
        cCtx.globalAlpha = Math.max(0, Math.min(1, p.opacity));
        if (p.img && p.img.complete && p.img.naturalWidth) {
          const h = p.w * (p.img.naturalHeight / p.img.naturalWidth);
          cCtx.drawImage(p.img, -p.w / 2, -h / 2, p.w, h);
        }
        cCtx.restore();
      }
    });

    if (alive) requestAnimationFrame(animateConfetti);
    else cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
  }
  animateConfetti();
}

// ===== KERMISBOODSCHAPPEN: flitsen in de witte marge naast het rad =====
(function flashMessages() {
  const layer = document.getElementById('flashLayer');
  const messages = ['Altijd prijs', 'Kom dat zien, kom dat zien', 'Ding ding'];
  const colors = ['#00B800', '#FC470F', '#3391FF', '#E80094'];
  let last = -1, side = 0;

  function idle() {
    // enkel op het beginscherm, en enkel als er witte marge naast het rad is
    // enkel vóór de allereerste trek van de sessie; daarna blijven ze weg, ook na "Opnieuw draaien"
    return !document.hidden
      && !window.hasSpunOnce
      && !document.querySelector('.finale-overlay.active, .winner-overlay.active, .settings-panel.open')
      && window.innerWidth >= 900;
  }
  // verborgen tab: animaties staan stil, dus alles wat er nog hangt opruimen
  document.addEventListener('visibilitychange', () => { if (document.hidden) layer.innerHTML = ''; });
  function flash() {
    const stage = document.querySelector('.wheel-stage').getBoundingClientRect();
    const leverRight = document.getElementById('lever').getBoundingClientRect().right;
    side = 1 - side; // om de beurt links en rechts
    const zone = side === 0
      ? { x0: 16, x1: stage.left - 16 }
      : { x0: leverRight + 16, x1: window.innerWidth - 16 };
    if (zone.x1 - zone.x0 < 140) return;
    let i; do { i = Math.floor(Math.random() * messages.length); } while (i === last);
    last = i;
    const el = document.createElement('div');
    el.className = 'flash' + (Math.random() < 0.35 ? ' hi' : '');
    el.textContent = messages[i];
    el.style.setProperty('--rot', ((Math.random() - 0.5) * 16).toFixed(1) + 'deg');
    el.style.setProperty('--hi', colors[Math.floor(Math.random() * colors.length)]);
    el.style.width = Math.min(zone.x1 - zone.x0, 320) + 'px';
    el.style.left = (zone.x0 + Math.random() * Math.max(0, zone.x1 - zone.x0 - parseFloat(el.style.width))) + 'px';
    el.style.top = (stage.top + Math.random() * (stage.height - 80)) + 'px';
    layer.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
  function loop() {
    if (idle()) flash();
    setTimeout(loop, 1800 + Math.random() * 2200);
  }
  setTimeout(loop, 1500);
})();

// ===== PIJLEN NAAR DE HENDEL: vanaf winnaar 1 tot je opnieuw trekt =====
(function arrowsToLever() {
  const layer = document.getElementById('arrowLayer');
  const arrow = '<svg viewBox="0 0 29 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M27.1102 5.87437C24.3923 5.87437 21.9151 3.65336 21.9151 1.21436V0.214355H19.6855V1.21436C19.6855 2.98836 20.5528 4.65236 21.914 5.87437H0.354614V7.87437H21.914C20.5528 9.09637 19.6855 10.7604 19.6855 12.5344V13.5344H21.9151V12.5344C21.9151 10.0954 24.3923 7.87437 27.1102 7.87437H28.225V5.87437H27.1102Z" fill="black"/></svg>';
  function active() {
    return !document.hidden && winners.length === 1 && !spinning
      && !document.querySelector('.finale-overlay.active, .winner-overlay.active, .settings-panel.open');
  }
  function shoot() {
    const hint = document.getElementById('spinBtn').getBoundingClientRect();
    const heart = document.querySelector('.lever-knob').getBoundingClientRect();
    // van net rechts van de hint naar net voor het hartje
    const x0 = hint.right + 10 + (Math.random() - 0.5) * 10, y0 = hint.top + hint.height / 2 + (Math.random() - 0.5) * 10;
    const tx = heart.left - 8, ty = heart.top + heart.height / 2;
    const dx = tx - x0, dy = ty - y0, len = Math.hypot(dx, dy);
    if (len < 60) return;
    const a = Math.atan2(dy, dx) * 180 / Math.PI;
    const s = 0.78; // stop net voor het hart
    const el = document.createElement('div');
    el.innerHTML = arrow;
    const svg = el.firstChild;
    svg.style.setProperty('--x0', x0 + 'px'); svg.style.setProperty('--y0', (y0 - 27) + 'px');
    svg.style.setProperty('--x1', (x0 + dx * s) + 'px'); svg.style.setProperty('--y1', (y0 + dy * s - 27) + 'px');
    svg.style.setProperty('--a', a.toFixed(1) + 'deg');
    layer.appendChild(svg);
    svg.addEventListener('animationend', () => svg.remove());
  }
  function loop() {
    if (active()) shoot(); else layer.innerHTML = '';
    setTimeout(loop, 650 + Math.random() * 400);
  }
  loop();
})();

// ===== MUISSPOOR: Kind Kids-artefacten achter de cursor =====
(function mouseTrail() {
  const canvas = document.getElementById('trail');
  const ctx2 = canvas.getContext('2d');
  const arrowSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="29" height="14" viewBox="0 0 29 14" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M27.1102 5.87437C24.3923 5.87437 21.9151 3.65336 21.9151 1.21436V0.214355H19.6855V1.21436C19.6855 2.98836 20.5528 4.65236 21.914 5.87437H0.354614V7.87437H21.914C20.5528 9.09637 19.6855 10.7604 19.6855 12.5344V13.5344H21.9151V12.5344C21.9151 10.0954 24.3923 7.87437 27.1102 7.87437H28.225V5.87437H27.1102Z" fill="COLOR"/></svg>';
  const colors = ['#00B800', '#FC470F', '#3391FF', '#E80094', '#000000'];
  const arrows = colors.map(c => { const i = new Image(); i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(arrowSvg.replace('COLOR', c)); return i; });
  const logos = colors.map(c => logoImage(c));
  const kribbels = KRIBBEL_NAMES.map(n => colors.map(c => kribbelImage(n, c)));
  const parts = [];
  let lastX = null, lastY = null, running = false;

  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  function spawn(x, y, dx, dy) {
    const r = Math.random();
    const ci = Math.floor(Math.random() * colors.length);
    const base = {
      x, y,
      // rustig: neemt maar een beetje vaart van de muis mee, dwarrelt dan traag neer
      vx: dx * 0.02 + (Math.random() - 0.5) * 0.5,
      vy: dy * 0.02 + (Math.random() - 0.5) * 0.5,
      rot: (Math.random() - 0.5) * 0.8,
      spin: (Math.random() - 0.5) * 0.04,
      life: 1, decay: 0.006 + Math.random() * 0.004,
      color: colors[ci]
    };
    if (r < 0.55) {
      const set = kribbels[Math.floor(Math.random() * kribbels.length)];
      parts.push({ ...base, kind: 'kribbel', img: set[ci], w: 26 + Math.random() * 22 });
    }
    else if (r < 0.8) parts.push({ ...base, kind: 'logo', img: logos[ci], w: 34 + Math.random() * 22 });
    else parts.push({ ...base, kind: 'arrow', img: arrows[ci], w: 22 + Math.random() * 14 });
  }

  function tick() {
    ctx2.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.012; p.vx *= 0.985; p.rot += p.spin; p.life -= p.decay;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      ctx2.save();
      ctx2.translate(p.x, p.y);
      ctx2.rotate(p.rot);
      ctx2.globalAlpha = Math.max(0, p.life);
      const sc = 0.75 + 0.25 * p.life;
      if (p.img.complete && p.img.naturalWidth) {
        const w = p.w * sc, h = w * (p.img.naturalHeight / p.img.naturalWidth);
        ctx2.drawImage(p.img, -w / 2, -h / 2, w, h);
      }
      ctx2.restore();
    }
    if (parts.length) requestAnimationFrame(tick); else running = false;
  }

  window.addEventListener('mousemove', e => {
    if (lastX !== null) {
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      const dist = Math.hypot(dx, dy);
      if (dist < 18) return;
      // hoe sneller je beweegt, hoe meer er afvalt (maar nooit een wolk)
      const n = Math.min(2, 1 + Math.floor(dist / 60));
      for (let i = 0; i < n; i++) spawn(lastX + dx * (i / n), lastY + dy * (i / n), dx, dy);
    }
    lastX = e.clientX; lastY = e.clientY;
    if (!running) { running = true; requestAnimationFrame(tick); }
  });
})();
